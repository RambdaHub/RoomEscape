<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3시 47분 — 공포 방탈출</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=East+Sea+Dokdo&family=Gowun+Batang:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
/* VOICE: 속삭이듯 짧은 문장, 서늘하고 조용한 공포
   IDEA: 손전등 하나로 더듬는 정전된 아이 방 — 화면 자체가 어둠
   PICTURE: 방 전체를 그린 SVG 장면, 손가락/커서를 따라가는 손전등 원
   COLOUR and TYPE: 먹색 #070505, 촛농빛 #d9ccb0, 말라붙은 피 #8a1010, 자외선 보라 #b98cff / East Sea Dokdo, Gowun Batang, Nanum Pen Script
   LAYOUT: 상단 타이머 줄, 가운데 방, 아래 소지품과 독백 한 줄 */
:root{color-scheme:dark;--bg:#070505;--ink:#d9ccb0;--dim:#8b8070;--blood:#8a1010;--uv:#b98cff;--paper:#1a1512}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Gowun Batang",serif;overflow-x:clip;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--uv);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:12px max(3vw,10px) 24px}
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.hud h1{font:400 clamp(32px,6vw,46px)/1 "East Sea Dokdo",cursive;margin:0;color:#c9b99a;letter-spacing:1px;flex:1}
.timer{font:700 20px/1 "Gowun Batang";font-variant-numeric:tabular-nums;padding:10px 12px;border:1px solid #3a2a22;border-radius:6px;white-space:nowrap}
.timer.low{color:#ff5a4a;border-color:var(--blood);animation:pulse 1.1s infinite}
.btn{background:#14100d;border:1px solid #3a2a22;border-radius:6px;min-height:44px;padding:8px 14px}
.btn:hover{border-color:#6b4a3a}
.btn.red{background:#3a0808;border-color:var(--blood)}
.stage{position:relative;width:100%;aspect-ratio:8/7;max-height:78vh;margin:0 auto;border-radius:8px;overflow:hidden;touch-action:none;background:#000;box-shadow:0 0 0 1px #221814,0 20px 60px #000}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.obj{cursor:pointer}.obj .hit{fill:transparent}
.uvt{opacity:0;transition:opacity .4s}
body.uv .uvt{opacity:1}
.dark{position:absolute;inset:0;pointer-events:none;--x:50%;--y:45%;--r:24%;
 background:radial-gradient(circle at var(--x) var(--y),rgba(255,230,180,.06) 0,rgba(0,0,0,0) calc(var(--r)*.45),rgba(0,0,0,.88) var(--r),rgba(0,0,0,.975) calc(var(--r)*1.7))}
body.uv .dark{background:radial-gradient(circle at var(--x) var(--y),rgba(140,60,255,.22) 0,rgba(60,0,140,.1) calc(var(--r)*.45),rgba(0,0,0,.9) var(--r),rgba(0,0,0,.98) calc(var(--r)*1.6))}
.dark.flick{animation:flick .9s steps(2) 1}
.say{min-height:3.2em;margin:10px 2px 6px;font-size:17px;color:#cbbd9f}
.inv{display:flex;gap:8px;flex-wrap:wrap}
.inv .empty{color:var(--dim);font-size:14px;padding:10px 0}
.item{display:flex;align-items:center;gap:8px;background:#120e0b;border:1px solid #33251d;border-radius:6px;min-height:48px;padding:6px 12px}
.item.on{border-color:var(--uv);box-shadow:0 0 14px rgba(185,140,255,.35);color:#e6d8ff}
.item svg{width:26px;height:26px;flex:none}
.foot{margin-top:14px;font-size:13px;color:var(--dim)}
.layer{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.82)}
.layer.show{display:flex}
.panel{width:min(460px,100%);max-height:90vh;overflow:auto;background:var(--paper);border:1px solid #3a2a22;border-radius:10px;padding:20px;box-shadow:0 20px 80px #000}
.panel h2{font:400 34px/1.05 "East Sea Dokdo";margin:0 0 10px;color:#d4c4a4}
.panel p{margin:.4em 0}
.note{font:24px/1.35 "Nanum Pen Script",cursive;color:#2a1d14;background:#c9b896;padding:16px 18px;border-radius:3px;transform:rotate(-1deg);box-shadow:inset 0 0 40px rgba(80,40,10,.45)}
.uvnote{font:26px/1.3 "Nanum Pen Script";color:var(--uv);text-shadow:0 0 10px rgba(185,140,255,.8);text-align:center;padding:14px}
.mirror{transform:scaleX(-1);display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.wheels{display:flex;gap:8px;justify-content:center;margin:12px 0}
.wheel{display:grid;gap:4px;justify-items:center}
.wheel b{font:700 34px/1 "Gowun Batang";width:52px;text-align:center;padding:10px 0;background:#0c0907;border:1px solid #4a3528;border-radius:6px}
.wheel button{width:52px;min-height:40px;background:#16110d;border:1px solid #33251d;border-radius:6px}
.keys{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:12px}
.keys button{min-height:64px;background:linear-gradient(#e8dfc8,#b8ab8c);color:#2a1d14;border:0;border-radius:4px 4px 8px 8px;font-weight:700}
.keys button:active{background:#9d8f70}
.dots{text-align:center;letter-spacing:6px;color:var(--uv);min-height:1.6em;font-size:18px}
input.name{width:100%;font:22px "Gowun Batang";padding:12px;background:#0c0907;color:var(--ink);border:1px solid #4a3528;border-radius:6px;margin-top:10px}
#scare{z-index:40;background:#000;display:none}
#scare.show{display:flex;animation:shake .08s infinite}
#scare svg{width:min(90vw,520px)}
#intro,#end{z-index:30;background:radial-gradient(circle at 50% 40%,#1a0d0a,#000 70%);flex-direction:column;text-align:center}
.big{font:400 clamp(64px,16vw,120px)/.9 "East Sea Dokdo";color:#b31b12;text-shadow:0 0 30px rgba(180,20,10,.5);margin:0}
.lede{max-width:30em;margin:14px auto 22px;color:#c2b393}
@keyframes pulse{50%{opacity:.55}}
@keyframes flick{0%{opacity:1}30%{opacity:.2}60%{opacity:1}80%{opacity:.4}}
@keyframes shake{0%{transform:translate(4px,-3px)}50%{transform:translate(-5px,4px)}100%{transform:translate(3px,2px)}}
.fuses{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:14px 0}
.fuses button{min-height:92px;background:#0c0b0a;border:1px solid #444;border-radius:6px;display:grid;justify-items:center;align-content:center;gap:8px}
.fuses i{width:14px;height:14px;border-radius:50%;background:#2a1010;display:block}
.fuses .on i{background:#ffcf5a;box-shadow:0 0 12px #ffb000}
.fuses s{width:14px;height:30px;border-radius:3px;background:#777;display:block;text-decoration:none;transform:translateY(8px)}
.fuses .on s{transform:translateY(-8px);background:#ccc}
.bottles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:14px 0;text-align:center;font-size:14px}
.bottles div{display:grid;justify-items:center;gap:4px}
.bottles svg{width:44px;height:80px}
.bottles b{font:700 22px "Nanum Pen Script";color:var(--uv);text-shadow:0 0 8px var(--uv);min-height:26px}
.morse{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font:20px/1.3 "Gowun Batang";color:#2a1d14;letter-spacing:3px}
.led{width:46px;height:46px;border-radius:50%;margin:14px auto;background:#2a0808;box-shadow:inset 0 0 8px #000}
.led.on{background:#ff3b2a;box-shadow:0 0 26px #ff2a1a}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.pad button{min-height:52px;background:#1d1b19;border:1px solid #4a4440;border-radius:6px;font-size:20px}
.screen{font:700 30px/1 "Gowun Batang";letter-spacing:10px;text-align:center;padding:12px;background:#0a120a;color:#7dff8a;border-radius:6px;min-height:54px;font-variant-numeric:tabular-nums}
.xray{background:#000;border-radius:6px;padding:10px}
.xray p{font:28px "Nanum Pen Script";color:#bfe4ff;text-shadow:0 0 10px #6ab8ff;text-align:center;margin:6px 0}
@media(prefers-reduced-motion:reduce){.dark.flick,#scare.show,.timer.low{animation:none}}
@media(max-width:600px){.stage{aspect-ratio:8/7.4}.say{font-size:16px}}
</style>
</head>

<script>
{
const $=s=>document.querySelector(s);
const stage=$('#stage'),dark=$('#dark'),say=$('#say'),modal=$('#modal'),panel=$('#panel');
let room=1;
const G={time:1200,started:false,done:false,sound:true,uvOn:false};
const S={drawer:false,uv:false,photo:false,box:false,key:false,note:false,unlocked:false,doll:0,wrong:0,hint:[0,0,0],seq:[],digits:[0,0,0,0]};
const B={power:false,fuse:[0,0,0,0,0],safe:false,digits:[0,0,0,0,0],film:false,tape:false,filmIn:false,tapeIn:false,playing:false,ring:false,pad:'',hint:[0,0,0],wrong:0,used:0};
const NOTES={'도':261.63,'레':293.66,'미':329.63,'파':349.23,'솔':392};
const SONG=['미','레','도','레','미','미','미'];
const MORSE={1:'.----',2:'..---',3:'...--',4:'....-',5:'.....',6:'-....',7:'--...',8:'---..',9:'----.',0:'-----'};
const TAPE='3861',DOOR='1683',SAFE='72941';
const BOTTLES=[['빨강','#8a1c1c',4],['흰색','#c8c4b8',1],['파랑','#1c3a8a',7],['노랑','#b8a01c',9],['초록','#1c6a2c',2]];
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- 소리 ---------- */
let ac=null,master=null;
function initAudio(){
 try{
  ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=G.sound?.55:0;master.connect(ac.destination);
  const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=180;const g=ac.createGain();g.gain.value=.12;f.connect(g);g.connect(master);
  [55,58.3,82.6].forEach(fr=>{const o=ac.createOscillator();o.type='sawtooth';o.frequency.value=fr;o.connect(f);o.start()});
  const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=.07;lg.gain.value=90;lfo.connect(lg);lg.connect(f.frequency);lfo.start();
  const n=ac.createBufferSource();n.buffer=noiseBuf(4);n.loop=true;const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=500;bp.Q.value=.7;const ng=ac.createGain();ng.gain.value=.03;n.connect(bp);bp.connect(ng);ng.connect(master);n.start();
 }catch(e){ac=null}
}
function noiseBuf(sec){const b=ac.createBuffer(1,ac.sampleRate*sec,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
function tone(freq,dur,type,vol,slideTo,delay){
 if(!ac||!G.sound)return;const t=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();
 o.type=type||'sine';o.frequency.setValueAtTime(freq,t);if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
 o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);
}
function noise(dur,vol,freq,delay){
 if(!ac||!G.sound)return;const t=ac.currentTime+(delay||0),n=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
 n.buffer=noiseBuf(dur+.1);f.type='bandpass';f.frequency.value=freq||1000;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
 n.connect(f);f.connect(g);g.connect(master);n.start(t);n.stop(t+dur+.1);
}
const snd={
 click:()=>{tone(1800,.05,'square',.06);tone(900,.06,'square',.05,null,.05)},
 note:k=>{tone(NOTES[k]*2,1.4,'sine',.18);tone(NOTES[k]*4.02,.8,'triangle',.05)},
 wrong:()=>{tone(140,.5,'sawtooth',.12,70);noise(.3,.08,300)},
 good:()=>{[0,.12,.24].forEach((d,i)=>tone([523,659,784][i],.9,'sine',.12,null,d))},
 scare:()=>{noise(.9,.5,2200);tone(900,.9,'sawtooth',.3,60);tone(1240,.7,'square',.12,90)},
 beat:()=>{tone(62,.18,'sine',.5,40);tone(58,.2,'sine',.4,38,.22)},
 knock:()=>{[0,.35,.7].forEach(d=>{tone(90,.12,'triangle',.45,50,d);noise(.08,.25,400,d)})},
 whisper:()=>{noise(1.6,.06,2600);noise(1.2,.04,3400,.4)},
 ring:()=>{for(let i=0;i<8;i++){tone(440,.05,'square',.05,null,i*.1);tone(480,.05,'square',.05,null,i*.1+.05)}},
 hum:()=>{tone(120,1.5,'sawtooth',.06);tone(240,1.5,'square',.02)},
 beep:(d,delay)=>{if(!ac||!G.sound)return;const t=ac.currentTime+.05+delay,g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.9,t+.008);g.gain.setValueAtTime(.9,t+d-.01);g.gain.linearRampToValueAtTime(0,t+d);g.connect(master);
  [['square',.35],['sine',1]].forEach(([ty,v])=>{const o=ac.createOscillator(),og=ac.createGain();o.type=ty;o.frequency.value=760;og.gain.value=v;o.connect(og);og.connect(g);o.start(t);o.stop(t+d+.02)})}
};

/* ---------- 손전등 ---------- */
function aim(e){const r=stage.getBoundingClientRect();dark.style.setProperty('--x',(e.clientX-r.left)+'px');dark.style.setProperty('--y',(e.clientY-r.top)+'px')}
stage.addEventListener('pointermove',aim);stage.addEventListener('pointerdown',aim);
function flicker(){dark.classList.remove('flick');void dark.offsetWidth;dark.classList.add('flick')}
const setR=v=>dark.style.setProperty('--r',v);

/* ---------- UI ---------- */
function tell(t){say.textContent=t}
function open(html){panel.innerHTML=html+'<div class="row"><button class="btn" data-close>닫기</button></div>';modal.classList.add('show');const f=panel.querySelector('input,button:not([data-close])');if(f)f.focus()}
function close(){modal.classList.remove('show')}
modal.addEventListener('click',e=>{if(e.target===modal||e.target.closest('[data-close]'))close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
const fmt=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
function penalty(sec){G.time=Math.max(1,G.time-sec);$('#timer').textContent=fmt(G.time)}
function wheels(g,d){return `<div class="wheels">${d.map((v,i)=>`<div class="wheel"><button data-w="${i}" data-g="${g}" data-d="1" aria-label="${i+1}번째 올리기">▲</button><b id="${g}${i}">${v}</b><button data-w="${i}" data-g="${g}" data-d="-1" aria-label="${i+1}번째 내리기">▼</button></div>`).join('')}</div>`}

const ICON={
 uv:'<svg viewBox="0 0 26 26"><rect x="3" y="10" width="14" height="7" rx="2" fill="#4a3a5a"/><path d="M17 8 l6 -3 v16 l-6 -3z" fill="#7a5aa8"/><circle cx="22" cy="13" r="2" fill="#b98cff"/></svg>',
 photo:'<svg viewBox="0 0 26 26"><path d="M3 5 h20 v14 l-5 3 h-15z" fill="#c9b896"/><rect x="6" y="8" width="14" height="10" fill="#3a2e26"/><circle cx="13" cy="12" r="3" fill="#8c7a64"/></svg>',
 key:'<svg viewBox="0 0 26 26"><circle cx="7" cy="13" r="5" fill="none" stroke="#9b7a40" stroke-width="3"/><path d="M12 13 h12 M20 13 v4 M23 13 v3" stroke="#9b7a40" stroke-width="3"/></svg>',
 note:'<svg viewBox="0 0 26 26"><path d="M5 3 h13 l3 3 v17 h-16z" fill="#c9b896"/><path d="M8 10 h10 M8 14 h8 M8 18 h9" stroke="#5a4232" stroke-width="1.5"/></svg>',
 film:'<svg viewBox="0 0 26 26"><rect x="3" y="4" width="20" height="18" fill="#1a2a34"/><path d="M13 7 v12 M8 10 q5 2 10 0 M8 14 q5 2 10 0" stroke="#bfe4ff" stroke-width="1.5" fill="none"/></svg>',
 tape:'<svg viewBox="0 0 26 26"><rect x="2" y="6" width="22" height="14" rx="2" fill="#2a2a2a"/><circle cx="9" cy="13" r="3" fill="#888"/><circle cx="17" cy="13" r="3" fill="#888"/><rect x="5" y="8" width="16" height="3" fill="#c9b896"/></svg>'
};
function renderInv(){
 const it=[],uvl=G.uvOn?'자외선 손전등 (켜짐)':'자외선 손전등';
 if(room===1){
  if(S.uv)it.push(['uv',uvl]);if(S.photo)it.push(['photo','찢어진 사진']);if(S.key)it.push(['key','녹슨 열쇠']);if(S.note)it.push(['note','구겨진 쪽지']);
 }else{
  it.push(['uv',uvl]);if(B.film&&!B.filmIn)it.push(['film','엑스레이 필름']);if(B.tape&&!B.tapeIn)it.push(['tape','카세트테이프']);
 }
 $('#inv').innerHTML=it.length?it.map(([k,l])=>`<button class="item${k==='uv'&&G.uvOn?' on':''}" data-i="${k}">${ICON[k]}<span>${l}</span></button>`).join(''):'<span class="empty">소지품 없음</span>';
}
$('#inv').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b)useItem(b.dataset.i)});

function useItem(k){
 snd.click();
 if(k==='uv'){G.uvOn=!G.uvOn;document.body.classList.toggle('uv',G.uvOn);renderInv();
  tell(G.uvOn?'보랏빛이 번진다. 보이지 않던 것들이 떠오른다.':'자외선을 껐다. 다시 평범한 어둠.');return}
 if(k==='photo'){open(`<h2>찢어진 사진</h2>
  <svg viewBox="0 0 300 200" style="width:100%;background:#2a221c;border-radius:4px"><rect x="20" y="16" width="260" height="168" fill="#8c7d68"/><rect x="30" y="26" width="240" height="148" fill="#3a3028"/><circle cx="150" cy="80" r="28" fill="#a8957a"/><path d="M110 174 q40 -80 80 0z" fill="#6a4a4a"/><path d="M220 16 l60 0 l0 60 l-30 -10 l-10 20z" fill="#2a221c"/><path d="M128 72 l44 18 M128 90 l44 -18" stroke="#1a110c" stroke-width="4"/></svg>
  <p>얼굴이 긁혀 지워진 여자아이. 아래에 볼펜 글씨 <b>"서○"</b>, 뒷글자는 찢겨 나갔다.</p>
  ${G.uvOn?'<div class="uvnote">뒷면: 엄마가 불러준 자장가<br>미 레 도 레 미 미 미</div>':'<p style="color:var(--dim)">뒷면은 비어 있는 것 같다… 정말 그럴까.</p>'}`);return}
 if(k==='key'){tell('손바닥만 한 녹슨 열쇠. 이 방에 열쇠 구멍은 하나뿐이다.');return}
 if(k==='note'){open(`<h2>구겨진 쪽지</h2><div class="note">문 밖으로 나가고 싶으면<br>내 이름을 불러줘.<br>엄마는 끝까지 못 불렀어.</div>`);return}
 if(k==='film'){tell('뼈가 찍힌 필름. 빛에 비춰봐야 뭔가 보일 것 같다.');return}
 if(k==='tape'){tell('라벨에 삐뚤빼뚤한 글씨: "엄마 목소리". 들으려면 재생할 기계가 필요하다.')}
}

/* ---------- 1번 방 ---------- */
const OBJ1={
 clock(){open(`<h2>멈춘 벽시계</h2><p>초침이 떨리기만 할 뿐 움직이지 않는다. 짧은 바늘은 3과 4 사이, 긴 바늘은 47분을 가리킨다.</p><p style="color:var(--dim)">째깍… 소리는 계속 들리는데.</p>`)},
 diary(){open(`<h2>일기장</h2><div class="note">11월 26일<br>엄마가 또 그 노래를 불렀다. 시계가 멈춘 바로 그 시각에 엄마가 나를 불렀고, 나는 대답하지 않았다.<br><br>소중한 건 서랍에 넣었어. 숫자 네 개로 잠갔지. <u>그 시각 그대로.</u></div>`)},
 drawer(){
  if(S.drawer){open(`<h2>서랍</h2><p>텅 비었다. 바닥에 손톱으로 긁은 자국만 남아 있다.</p>`);return}
  open(`<h2>잠긴 서랍</h2><p id="lockMsg">네 자리 숫자 자물쇠가 달려 있다.</p>${wheels('d',S.digits)}<div class="row"><button class="btn red" id="tryLock">열어본다</button></div>`);
 },
 box(){
  if(S.box){open(`<h2>오르골</h2><p>뚜껑이 열린 채 태엽만 천천히 돈다. 아무도 감지 않았는데.</p>`);snd.note('미');return}
  S.seq=[];
  open(`<h2>오르골</h2><p>뚜껑이 잠겨 있다. 앞면에 작은 건반 다섯 개. 맞는 노래를 연주하면 열릴 것 같다.</p><div class="dots" id="dots">&nbsp;</div><div class="keys">${Object.keys(NOTES).map(k=>`<button data-k="${k}">${k}</button>`).join('')}</div><div class="row"><button class="btn" id="resetSeq">처음부터</button></div>`);
 },
 mirror(){open(G.uvOn?`<h2>거울</h2><p>보랏빛 아래 김 서린 거울에 손가락 글씨가 떠오른다. 거꾸로 쓰여 있다.</p><div class="uvnote"><span class="mirror">서윤아</span></div><p style="color:var(--dim)">거울 속 내 뒤에 누군가 서 있는 것 같다.</p>`:`<h2>거울</h2><p>뿌옇게 김이 서려 있다. 손가락으로 무언가 썼다 지운 흔적. 보통 빛으로는 읽을 수 없다.</p>`);if(G.uvOn)snd.whisper()},
 paint(){open(`<h2>엄마의 초상화</h2><p>그림 속 여자의 눈가가 젖어 있다. 만져보니 정말 축축하다.</p>${G.uvOn?'<div class="uvnote">미안해. 한 번만 더 불러볼걸.</div>':''}`)},
 doll(){
  S.doll++;
  if(S.doll===1)tell('낡은 헝겊 인형. 단추 눈 하나가 떨어져 있다.');
  else if(S.doll===2){tell('인형이… 아까와 다른 쪽을 보고 있다.');$('#dollHead').setAttribute('transform','rotate(-18 170 560)')}
  else if(S.doll===3){$('#dollMouth').setAttribute('d','M160 572 q10 12 20 0');scare('뒤돌아보지 마.')}
  else tell('인형은 이제 웃은 채로 움직이지 않는다.');
 },
 door(){
